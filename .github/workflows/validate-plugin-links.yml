name: Validate Plugin Links Patch

on:
  push:
    branches:
      - fix/plugin-additional-links-config

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact patch revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --no-check-all
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run focused PHPUnit coverage
        run: vendor/bin/phpunit --no-configuration --bootstrap tests/test_bootstrap.php --no-coverage Tests/Unit/PluginAdditionalLinksAbstractTest.php
      - name: Run focused coding standards
        run: vendor/bin/phpcs --standard=.phpcs.xml inc/PluginAdditionalLinksAbstract.php Tests/Unit/PluginAdditionalLinksAbstractTest.php
