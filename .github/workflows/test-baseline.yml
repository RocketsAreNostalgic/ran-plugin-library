name: Test baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} test baseline
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip
          tools: composer:v2
      - name: Validate locked manifests
        run: composer validate --strict
      - name: Install locked dependencies
        id: install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer test
      - name: PHP syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -path './vendor' -prune -o -type f -name '*.php' -print0)
      - name: Existing formatting contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer cs:check
      - name: Existing coding standards contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer standards:full
