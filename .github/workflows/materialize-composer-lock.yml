name: Materialize Composer lock

on:
  push:
    branches:
      - ci/adopt-php-quality-v2

permissions:
  contents: write

jobs:
  lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/adopt-php-quality-v2
          fetch-depth: 0

      - name: Set up PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Materialize locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf git@github.com:
          composer validate --strict --no-check-publish --no-check-all
          composer update --no-interaction --prefer-dist --no-progress --no-scripts
          test -f composer.lock

      - name: Commit generated lock only
        shell: bash
        run: |
          set -euo pipefail
          git add composer.lock
          test "$(git diff --cached --name-only)" = composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: materialize Composer lock'
          git push origin HEAD:ci/adopt-php-quality-v2
