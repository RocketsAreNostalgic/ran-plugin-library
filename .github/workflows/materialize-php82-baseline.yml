name: Normalize PHP 8.2 Composer lock

on:
  push:
    branches:
      - ci/adopt-php-quality-v2

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/adopt-php-quality-v2
          fetch-depth: 0

      - name: Set up actual PHP floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Preserve resolved versions and refresh lock metadata
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf git@github.com:
          git show 70dabc70eae3e62b0fa2e585d8edb181cc982e64:composer.lock > composer.lock
          composer update --lock --no-install --no-interaction --no-progress --no-scripts
          composer validate --strict --no-check-publish --no-check-all
          composer install --no-interaction --prefer-dist --no-progress
          composer check

      - name: Commit lock metadata only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = composer.lock
          git add composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: normalize Composer lock for PHP 8.2'
          git push origin HEAD:ci/adopt-php-quality-v2
